<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="../static/js/main.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experimental Procedure</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="../static/styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light nb-background-color">
      <a href="/" class="navbar-brand">
        <img
          src="../static/img/voltage.png"
          alt="Water Logo"
          width="20px"
          style="margin-left: 10px"
          class="d-inline-block align-text-top"
        />
      </a>
      <button
        class="navbar-toggler"
        style="color: black"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navmenu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navmenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a
              href="author"
              style="color: red"
              class="nav-link hover-underline-animation hover-link-underline-secondary nbMenuItem"
              >Author</a
            >
          </li>
          <li class="nav-item">
            <a
              href="workscited"
              style="color: red"
              class="nav-link hover-underline-animation hover-link-underline-secondary nbMenuItem"
              >Works Cited</a
            >
          </li>
          <li class="nav-item">
            <a
              href="procedure"
              class="nav-link hover-underline-animation nbMenuItem"
            >
              Procedure</a
            >
          </li>
          <li class="nav-item">
            <a
              href="results"
              class="nav-link hover-underline-animation nbMenuItem"
              >Results</a
            >
          </li>
        </ul>
      </div>
    </nav>

    <div class="container">{% block content %}{% endblock %}</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
